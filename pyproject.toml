[project]
name = "c2fpl"
version = "0.1.0"
description = "C2FPL: Coarse-to-Fine Pseudo-Labeling for unsupervised video anomaly detection (WACV 2024)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
    "torch>=2.1",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
notebook = ["jupyter>=1.0", "ipykernel>=6.25"]

[tool.uv]
# torch resolves to the CPU/CUDA wheel that matches the host platform.
package = false
